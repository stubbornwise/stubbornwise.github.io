<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contagem Regressiva - 17 de Julho</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2em;
    }

    .countdown {
      display: flex;
      gap: 20px;
      font-size: 2em;
    }

    .countdown div {
      text-align: center;
    }

    .label {
      font-size: 0.6em;
      color: #aaa;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>Contagem Regressiva para 17 de Julho de 2025</h1>

  <div class="countdown">
    <div>
      <span id="dias">--</span>
      <div class="label">dias</div>
    </div>
    <div>
      <span id="horas">--</span>
      <div class="label">horas</div>
    </div>
    <div>
      <span id="minutos">--</span>
      <div class="label">minutos</div>
    </div>
    <div>
      <span id="segundos">--</span>
      <div class="label">segundos</div>
    </div>
  </div>

  <script>
    const diasEl = document.getElementById("dias");
    const horasEl = document.getElementById("horas");
    const minutosEl = document.getElementById("minutos");
    const segundosEl = document.getElementById("segundos");

    const dataAlvo = new Date("2025-07-17T00:00:00").getTime();

    function atualizarContagem() {
      const agora = new Date().getTime();
      const diferenca = dataAlvo - agora;

      if (diferenca <= 0) {
        diasEl.innerText = "0";
        horasEl.innerText = "0";
        minutosEl.innerText = "0";
        segundosEl.innerText = "0";
        return;
      }

      const segundos = Math.floor((diferenca / 1000) % 60);
      const minutos = Math.floor((diferenca / 1000 / 60) % 60);
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));

      diasEl.innerText = dias;
      horasEl.innerText = horas;
      minutosEl.innerText = minutos;
      segundosEl.innerText = segundos;
    }

    atualizarContagem();
    setInterval(atualizarContagem, 1000);
  </script>

</body>
</html>
